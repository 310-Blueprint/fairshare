spring.application.name=FairShare
# Supply SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, and
# SPRING_DATASOURCE_PASSWORD through the runtime environment.
spring.config.import=optional:file:.env[.properties]

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-migration-naming=true

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
server.servlet.session.cookie.same-site=lax

# Receipt images are processed in memory and are never persisted by FairShare.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
receipt.max-file-size-bytes=10485760

# Gemini performs the primary structured receipt extraction. Tesseract remains the local fallback.
gemini.model=gemini-3.5-flash-lite
gemini.timeout-seconds=35

# #14: exchange rates for expenses entered in a foreign currency.
fairshare.exchange-rate.base-url=https://api.frankfurter.dev/v1
